<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | EdCube</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style1.css"> <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <header class="site-header">
        <div class="header-content">
            <div class="header-left">
                <img src="icons/logo.ico" alt="EdCube Logo" class="logo-img">
            </div>
            <nav class="header-right">
                <a href="/proxies" class="nav-btn">
                    <i data-lucide="globe"></i>
                    <span class="btn-text">Proxies</span>
                </a>

                <button class="nav-btn" onclick="openBlank()">
                    <i data-lucide="external-link"></i>
                    <span class="btn-text">About:Blank</span>
                </button>

                <a href="/settings" class="nav-btn">
                    <i data-lucide="settings"></i>
                    <span class="btn-text">Settings</span>
                </a>

                <div class="search-wrapper">
                    <i data-lucide="search"></i>
                    <input type="text" placeholder="Search games..." class="search-input">
                </div>
            </nav>
        </div>
    </header>

    <main class="main-wrapper">
        <section class="hero-banner">
            <h1>Welcome to EdCube!</h1>
            <p>Experience the next generation of web gaming.</p>
        </section>

        <section class="game-library">
            <h2 class="section-subtitle">All Games</h2>
            <div class="game-grid">
                <a href="games/game.html" class="game-card"><div class="card-inner"><div class="card-thumb" style="background-image: url('game_images/bitlife-thumb.jpg');"></div><div class="card-overlay"><span class="card-title">Bitlife</span></div></div></a>
                <a href="#" class="game-card"><div class="card-inner"><div class="card-thumb" style="background-image: url('game_images/placeholder.jpg');"></div><div class="card-overlay"><span class="card-title">Coming Soon</span></div></div></a>
                <a href="#" class="game-card"><div class="card-inner"><div class="card-thumb" style="background-image: url('game_images/placeholder.jpg');"></div><div class="card-overlay"><span class="card-title">Coming Soon</span></div></div></a>
                <a href="#" class="game-card"><div class="card-inner"><div class="card-thumb" style="background-image: url('game_images/placeholder.jpg');"></div><div class="card-overlay"><span class="card-title">Coming Soon</span></div></div></a>
            </div>
        </section>

    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <p>Copyright © 2024-2026 All Rights Reserved by EdCube.</p>
        </div>
    </footer>

    <script>
        lucide.createIcons();
        
        // Simple search filter logic
        const searchInput = document.querySelector('.search-bar input');
        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('.game-card');
            cards.forEach(card => {
                const title = card.querySelector('.card-title').innerText.toLowerCase();
                card.style.display = title.includes(term) ? 'block' : 'none';
            });
        });
    </script>
</body>
</html>
