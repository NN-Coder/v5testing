<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EdCube | Loading...</title>
    <link rel="icon" href="../icons/logo.ico" type="image/x-icon">

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <header class="site-header">
        <div class="header-content">
            <div class="header-left">
                <a href="../home.html">
                    <img src="../icons/logo.ico" alt="EdCube Logo" class="logo-img" title="Back to Home" loading="lazy">
                </a>
            </div>
            <nav class="header-right">
                <a href="../home.html" class="nav-icon-link" title="Back to Home">
                    <i data-lucide="home"></i>
                    <span>Home</span>
                </a>
                <button class="nav-icon-link" onclick="openBlank()" title="About:Blank Cloaking">
                    <i data-lucide="external-link"></i>
                    <span>Cloak</span>
                </button>
            </nav>
        </div>
    </header>

    <main class="main-wrapper">
        <section class="game-section">
            <h1 class="game-title" id="displayTitle">Loading...</h1>

            <div class="iframe-container">
                <iframe src="" id="gameFrame" allowfullscreen></iframe>
                
                <div class="options-bar">
                    <button class="nav-icon-link" id="fullscreenBtn" title="Fullscreen (F)">
                        <i data-lucide="maximize"></i>
                    </button>
                    <button class="nav-icon-link" id="shareBtn" title="Share">
                        <i data-lucide="share-2"></i>
                    </button>
                    <a href="https://github.com/your-repo/issues" target="_blank" class="nav-icon-link" title="Report Bug">
                        <i data-lucide="flag"></i>
                    </a>
                </div>
            </div>
        </section>

        <section class="recommended-section">
            <h2 class="section-subtitle">Recommended Games</h2>
            <div class="game-grid" id="recommendedGrid"></div>
        </section>

        <a href="../home.html" class="back-link">
            <button class="back-button">Back to Home</button>
        </a>
    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <p>Copyright © 2024-2026 All Rights Reserved by EdCube.</p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        /**
         * Implementation of the about:blank cloaking utility 
         * consistent with your home page logic.
         */
        function openBlank() {
            const win = window.open();
            if (!win) {
                alert("Please allow popups to use this feature.");
                return;
            }
            const url = window.location.href;
            const iframe = win.document.createElement('iframe');
            
            iframe.style.width = "100%";
            iframe.style.height = "100%";
            iframe.style.border = "none";
            iframe.style.position = "fixed";
            iframe.style.top = "0";
            iframe.style.left = "0";
            iframe.src = url;
            
            win.document.body.style.margin = "0";
            win.document.body.appendChild(iframe);
        }
    </script>
</body>
</html>
