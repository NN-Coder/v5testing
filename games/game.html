<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitlife | EdCube</title>
    <link rel="icon" href="../icons/logo.ico" type="image/x-icon">

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <header class="site-header">
        <div class="header-content">
            <div class="header-left">
                <a href="../home.html"><img src="../icons/logo.ico" alt="EdCube Logo" class="logo-img" title="Back to Home"></a>
            </div>
            <nav class="header-right">
                <a href="../home.html" class="nav-icon-link header-home" title="Back to Home">
                    <i data-lucide="home"></i>
                    <span>Home</span>
                </a>
            </nav>
        </div>
    </header>

    <main class="main-wrapper">
        <section class="game-section">
            <h1 class="game-title">Bitlife</h1>

            <div class="iframe-container">
                <iframe src="../game_sources/" id="gameFrame" allowfullscreen></iframe>
                
                <div class="options-bar">
                    <button class="nav-icon-link" id="fullscreenBtn" title="Fullscreen (F)">
                        <i data-lucide="maximize"></i>
                    </button>
                    <button class="nav-icon-link" id="shareBtn" title="Share">
                        <i data-lucide="share-2"></i>
                    </button>
                    <a href="#" class="nav-icon-link" title="Report Bug">
                        <i data-lucide="flag"></i>
                    </a>
                </div>
            </div>
        </section>

        <section class="recommended-section">
            <h2 class="section-subtitle">Recommended Games</h2>
            <div class="game-grid">
                
                <a href="#" class="game-card">
                    <div class="card-inner">
                        <div class="card-thumb" style="background-image: url('game-thumb.jpg');"></div>
                        <div class="card-overlay">
                            <span class="card-title">Game Title</span>
                        </div>
                    </div>
                </a>

                <a href="#" class="game-card">
                    <div class="card-inner">
                        <div class="card-thumb" style="background-image: url('game-thumb.jpg');"></div>
                        <div class="card-overlay">
                            <span class="card-title">Game Title</span>
                        </div>
                    </div>
                </a>

            </div>
        </section>

        <a href="../home.html" class="back-link">
            <button class="back-button">Back to Home</button>
        </a>
    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <p>Copyright © 2024-2026 All Rights Reserved by EdCube.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
